<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#eaf3fa">
    <title>充值缴费 · 小程序交互原型</title>
    <link rel="stylesheet" href="styles/app.css">
    <link rel="stylesheet" href="styles/recharge-h5.css">
    <link rel="stylesheet" href="styles/payment-success.css">
    <link rel="stylesheet" href="styles/real-name.css">
    <link rel="stylesheet" href="styles/family-number.css">
    <link rel="stylesheet" href="styles/family-number-exists.css">
    <link rel="stylesheet" href="styles/family-number-add.css">
    <link rel="stylesheet" href="styles/family-number-add-success.css">
    <link rel="stylesheet" href="styles/home-recharge.css">
    <link rel="stylesheet" href="styles/home-realname.css">
    <link rel="stylesheet" href="styles/home-family-pending.css">
    <link rel="stylesheet" href="styles/home-restart.css">
    <link rel="stylesheet" href="styles/home-normal.css">
    <link rel="stylesheet" href="styles/service-account-info.css">
    <link rel="stylesheet" href="styles/service-account-chat.css">
    <link rel="stylesheet" href="styles/mini-program-launch.css">
    <link rel="stylesheet" href="styles/browser-launch.css">
  </head>
  <body>
    <aside class="desktop-page-nav" aria-label="页面导航">
      <h2>页面导航</h2>
      <p>选择页面快速跳转</p>
      <nav id="desktop-route-list"></nav>
    </aside>
    <div class="preview-stage">
      <main id="root" class="prototype-shell">
        <section class="page" id="recharge-page" data-page-id="recharge"></section>
        <section class="empty-route" id="empty-route" hidden></section>
        <div class="review-overlay" id="review-overlay" hidden>
          <section class="review-sheet" role="dialog" aria-modal="true" aria-labelledby="review-title">
            <button class="review-close" data-close-review aria-label="关闭">×</button>
            <h2 id="review-title">页面导航</h2>
            <p class="review-subtitle">选择页面，或切换充值页演示状态。</p>
            <nav id="route-list" aria-label="项目页面"></nav>
            <h2>充值页状态</h2>
            <div class="debug-states" id="debug-states"></div>
          </section>
        </div>
        <div class="flow-overlay" id="flow-overlay" hidden>
          <section class="flow-sheet" id="flow-sheet" role="dialog" aria-modal="true"></section>
        </div>
        <div class="mini-program-launch" id="mini-program-launch" aria-hidden="true" hidden>
          <div class="mini-program-launch-status" aria-hidden="true">
            <span>22:50</span>
            <div class="mini-program-launch-status-right">
              <span class="mini-program-launch-signal"><i></i><i></i><i></i><i></i></span>
              <span>5G</span>
              <span class="mini-program-launch-battery"><i>83</i></span>
            </div>
          </div>
          <header class="mini-program-launch-nav" aria-label="米云智联小程序">
            <span class="mini-program-launch-back" aria-hidden="true"></span>
            <strong>米云智联</strong>
            <span class="mini-program-launch-capsule" aria-hidden="true"><i>•••</i><b></b><em></em></span>
          </header>
          <div class="mini-program-launch-loading" role="status" aria-live="polite">
            <span class="mini-program-launch-spinner" aria-hidden="true"></span>
            <span>正在打开小程序</span>
          </div>
        </div>
        <div class="browser-launch" id="browser-launch" aria-hidden="true" hidden>
          <div class="browser-launch-status" aria-hidden="true">
            <span>9:41</span>
            <div class="browser-launch-status-right">
              <span class="browser-launch-signal"><i></i><i></i><i></i><i></i></span>
              <span class="browser-launch-wifi" aria-hidden="true"></span>
              <span class="browser-launch-battery" aria-hidden="true"></span>
            </div>
          </div>
          <header class="browser-launch-toolbar" aria-label="浏览器">
            <span class="browser-launch-chevron" aria-hidden="true"></span>
            <div class="browser-launch-address">
              <span class="browser-launch-lock" aria-hidden="true"></span>
              <span>bestable.cn</span>
              <svg class="browser-launch-refresh" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.4 9.1a6.6 6.6 0 0 0-11.2-4L3.8 6.5M3.8 6.5V2.8M3.8 6.5h3.7M3.6 10.9a6.6 6.6 0 0 0 11.2 4l1.4-1.4m0 0v3.7m0-3.7h-3.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <span class="browser-launch-more" aria-hidden="true">•••</span>
          </header>
          <div class="browser-launch-progress" aria-hidden="true"><i></i></div>
          <section class="browser-launch-content" role="status" aria-live="polite">
            <span class="browser-launch-spinner" aria-hidden="true"></span>
            <strong>正在打开支付页面</strong>
            <span>请稍候…</span>
          </section>
          <footer class="browser-launch-bottom" aria-hidden="true">
            <span class="browser-launch-bottom-back"></span>
            <span class="browser-launch-bottom-forward"></span>
            <span class="browser-launch-share"></span>
            <span class="browser-launch-bookmark"></span>
            <span class="browser-launch-tabs">1</span>
          </footer>
        </div>
        <div class="payment-success-overlay" id="payment-success-overlay" hidden></div>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      </main>
    </div>
    <script src="data/mock.js"></script>
    <script src="pages/home-recharge.js"></script>
    <script src="pages/home-realname.js"></script>
    <script src="pages/home-family-pending.js"></script>
    <script src="pages/home-restart.js"></script>
    <script src="pages/home-normal.js"></script>
    <script src="pages/recharge.js"></script>
    <script src="pages/recharge-non-first.js"></script>
    <script src="pages/follow-service.js"></script>
    <script src="pages/service-account-info.js"></script>
    <script src="pages/service-account-chat.js"></script>
    <script src="pages/payment-guide.js"></script>
    <script src="pages/payment-success.js"></script>
    <script src="pages/real-name.js"></script>
    <script src="pages/family-number.js"></script>
    <script src="pages/family-number-exists.js"></script>
    <script src="pages/family-number-add.js"></script>
    <script src="pages/family-number-add-success.js"></script>
    <script src="components/prototype.js"></script>
  </body>
</html>
